name: 更新法人買賣超資料

on:
  schedule:
    # GitHub cron 為 UTC。台股法人資料約收盤後傍晚定案,排兩個時段(允許延遲)。
    - cron: '0 10 * * 1-5'   # 台北 18:00
    - cron: '0 12 * * 1-5'   # 台北 20:00
  workflow_dispatch:          # 也可在 Actions 頁面手動觸發

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取並產生 data.json
        run: node scripts/build-data.mjs
        env:
          TZ: Asia/Taipei

      - name: 上傳 data.json 到 R2
        run: npx -y wrangler@4 r2 object put tw-stocks-data/data.json --file docs/data.json --content-type application/json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
